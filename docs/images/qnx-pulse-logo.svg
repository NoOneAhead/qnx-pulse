<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="QNX-Pulse Logo">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1b33"/>
      <stop offset="55%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="55%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer rounded industrial chassis -->
  <rect x="16" y="16" width="480" height="480" rx="88" fill="url(#bgGrad)" stroke="url(#ringGrad)" stroke-width="8"/>

  <!-- Subtle technical microkernel grid -->
  <g stroke="rgba(56,189,248,0.10)" stroke-width="1.5">
    <line x1="96" y1="64" x2="96" y2="448"/>
    <line x1="176" y1="64" x2="176" y2="448"/>
    <line x1="256" y1="64" x2="256" y2="448"/>
    <line x1="336" y1="64" x2="336" y2="448"/>
    <line x1="416" y1="64" x2="416" y2="448"/>
    <line x1="64" y1="128" x2="448" y2="128"/>
    <line x1="64" y1="208" x2="448" y2="208"/>
    <line x1="64" y1="288" x2="448" y2="288"/>
    <line x1="64" y1="368" x2="448" y2="368"/>
  </g>

  <!-- Microkernel IPC Shield Ring -->
  <circle cx="256" cy="222" r="134" fill="rgba(0,212,255,0.05)" stroke="rgba(0,212,255,0.28)" stroke-width="3" stroke-dasharray="14 8"/>
  <circle cx="256" cy="222" r="108" fill="rgba(13,20,36,0.75)" stroke="url(#ringGrad)" stroke-width="4.5"/>

  <!-- Corner SMP core nodes -->
  <circle cx="148" cy="148" r="10" fill="#0d1424" stroke="#00d4ff" stroke-width="3.5"/>
  <circle cx="364" cy="148" r="10" fill="#0d1424" stroke="#10b981" stroke-width="3.5"/>
  <circle cx="148" cy="296" r="10" fill="#0d1424" stroke="#f59e0b" stroke-width="3.5"/>
  <circle cx="364" cy="296" r="10" fill="#0d1424" stroke="#f43f5e" stroke-width="3.5"/>

  <!-- Real-time Pulse Waveform -->
  <path d="M 96 222 H 168 L 198 148 L 238 300 L 278 134 L 314 252 L 338 222 H 416"
        fill="none" stroke="url(#pulseGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Highlight dot at peak -->
  <circle cx="278" cy="134" r="9" fill="#e0f2fe" stroke="#00d4ff" stroke-width="3"/>

  <!-- Wordmark & QNX 8.0 Pill -->
  <text x="256" y="408" text-anchor="middle" fill="#f1f5f9" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="46" font-weight="800" letter-spacing="4">QNX-PULSE</text>
  <rect x="166" y="426" width="180" height="32" rx="16" fill="rgba(0,212,255,0.14)" stroke="rgba(0,212,255,0.55)" stroke-width="2"/>
  <text x="256" y="447" text-anchor="middle" fill="#00d4ff" font-family="Consolas, monospace" font-size="17" font-weight="700" letter-spacing="1.5">QNX SDP 8.0</text>
</svg>
