[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qnx-pulse"
version = "1.0.0"
description = "QNX 8.0 Microkernel Trace, IPC Topology, Buildfile & Secpol Studio"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "QNX-Pulse Team" }
]
keywords = ["qnx", "qnx8", "rtos", "microkernel", "traceprinter", "secpol", "mkifs", "real-time", "automotive", "robotics"]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
qnx-pulse = "qnx_pulse.cli:app"

[tool.setuptools.packages.find]
include = ["qnx_pulse*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
